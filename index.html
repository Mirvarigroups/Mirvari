<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIRVARI GROUP</title>
<meta name="description" content="MIRVARI GROUP — social media management and custom business systems (databases and ERP).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0A4D3C;--gold:#C5A059;--sage:#7A9A8B;--navy:#1A202C;--cream:#F9F8F3;
--bg:#F9F8F3;--surface:rgba(122,154,139,.11);--text:#1A202C;--muted:rgba(26,32,44,.72);--line:rgba(122,154,139,.55);--contact:#1A202C;--accent:#0A4D3C;color-scheme:light}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.65 'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--green);z-index:10}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.1;margin:0}
html[lang="ckb"] body,html[lang="ckb"] h1,html[lang="ckb"] h2,html[lang="ckb"] h3{font-family:'Noto Sans Arabic',sans-serif;line-height:1.7}
html[lang="ckb"] h1,html[lang="ckb"] h2,html[lang="ckb"] h3{font-weight:700;line-height:1.45}
a{color:inherit;text-decoration:none}
p{margin:0}
.w{width:min(1100px,100% - 2.5rem);margin-inline:auto}
section{padding:clamp(3.5rem,8vw,6rem) 0}
h2{font-size:clamp(2rem,4vw,2.9rem)}
.intro{color:var(--muted);margin-top:.6rem;max-width:50ch}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--green);color:var(--cream)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 0}
.brand{display:flex;align-items:center;gap:.65rem;font-weight:600;letter-spacing:.08em;font-size:.92rem}
.logo{height:46px;width:auto;flex:none}
nav{display:flex;align-items:center;gap:1.4rem;font-size:.92rem}
nav a:hover{color:var(--gold)}
.lang{border:1px solid var(--gold);color:var(--gold);background:none;border-radius:999px;padding:.3rem .9rem;font:inherit;font-size:.85rem;cursor:pointer;transition:background .25s,color .25s}
.lang:hover{background:var(--gold);color:var(--navy)}

.hero{position:relative;overflow:hidden;background:var(--green);color:var(--cream);padding:clamp(3.5rem,9vw,7rem) 0 clamp(4rem,10vw,8rem)}
.hero::before{content:"";position:absolute;inset-inline-end:-140px;bottom:-160px;width:640px;height:640px;border-radius:50%;background:repeating-conic-gradient(rgba(122,154,139,.3) 0 1deg,transparent 1deg 10deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%)}
.hero::after{content:"";position:absolute;inset-inline-end:clamp(50px,11vw,180px);bottom:clamp(40px,8vw,140px);width:clamp(38px,6vw,64px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,var(--cream),var(--gold));box-shadow:0 18px 34px -14px rgba(26,32,44,.55)}
.hero .w{position:relative;z-index:1}
.hero h1{font-size:clamp(2.6rem,6.4vw,4.4rem);max-width:20ch}
.hero p{margin-top:1.2rem;max-width:56ch;color:rgba(249,248,243,.84)}
.actions{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2rem}
.btn{display:inline-flex;padding:.85rem 1.6rem;border-radius:999px;font-weight:600;font-size:.95rem;transition:transform .25s,background .25s,color .25s,border-color .25s}
.btn:hover{transform:translateY(-2px)}
.gold{background:var(--gold);color:var(--navy)}
.ghost{border:1.5px solid rgba(249,248,243,.55);color:var(--cream)}
.ghost:hover{border-color:var(--gold);color:var(--gold)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:2.4rem}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:16px;padding:clamp(1.5rem,3vw,2.2rem);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 36px -24px rgba(10,77,60,.5)}
.ic{width:46px;height:46px;border-radius:12px;background:var(--green);color:var(--gold);display:grid;place-items:center;margin-bottom:1.1rem}
.ic svg{width:24px;height:24px}
.card h3{font-size:1.6rem}
.card p{margin-top:.7rem;color:var(--muted)}
.card ul{list-style:none;padding:0;margin:1.2rem 0 0;display:grid;gap:.55rem}
.card li{display:flex;gap:.65rem;align-items:flex-start;font-size:.95rem}
.card li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sage);margin-top:.65em;flex:none}
.card .note{margin-top:1.2rem;font-size:.85rem;color:var(--accent);border-inline-start:3px solid var(--sage);padding-inline-start:.8rem}

.contact,footer{background:var(--contact);color:var(--cream)}
.contact .intro{color:rgba(249,248,243,.78)}
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:2.2rem}
.link{display:flex;flex-direction:column;gap:.3rem;padding:1.3rem 1.4rem;border:1px solid rgba(122,154,139,.5);border-radius:14px;transition:border-color .25s,transform .25s,background .25s}
.link:hover{border-color:var(--gold);transform:translateY(-3px);background:rgba(197,160,89,.08)}
.link b{color:var(--gold);font-size:.88rem;font-weight:600}
.link span{direction:ltr;text-align:start;overflow-wrap:anywhere}
html[dir="rtl"] .link span{text-align:right}
footer{padding:1.4rem 0;color:var(--sage);font-size:.85rem;border-top:1px solid rgba(122,154,139,.3)}

.form{margin-top:2.2rem;max-width:640px;padding:clamp(1.4rem,3vw,2rem);border:1px solid rgba(122,154,139,.5);border-radius:16px;display:grid;gap:1rem}
.form h3{font-size:1.6rem}
.form label{display:grid;gap:.4rem;font-size:.88rem;color:rgba(249,248,243,.85)}
.form input,.form textarea{width:100%;font:inherit;color:var(--cream);background:rgba(249,248,243,.06);border:1px solid rgba(122,154,139,.5);border-radius:10px;padding:.75rem .9rem;resize:vertical}
.form input[type="email"]{direction:ltr}
.form input:focus,.form textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.form .btn{justify-self:start;border:0;cursor:pointer;font-family:inherit}
.hint{font-size:.82rem;color:var(--sage)}

@media (prefers-reduced-motion:no-preference){
.hero .w>*{animation:up .8s ease both}
.hero .w>*:nth-child(2){animation-delay:.1s}
.hero .w>*:nth-child(3){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
}
@media (max-width:760px){.cards,.links{grid-template-columns:1fr}}
@media (max-width:520px){nav a{display:none}.brand{font-size:.82rem}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
